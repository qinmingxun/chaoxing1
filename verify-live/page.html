<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>u校园语音题仿真页（真实 MediaRecorder + React 式节点替换）</title>
<style>
  body { font-family: "Segoe UI", sans-serif; max-width: 720px; margin: 40px auto; }
  .record-button-group { display: flex; gap: 12px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; width: fit-content; }
  .record-button-group > div { width: 64px; height: 40px; display: flex; align-items: center; justify-content: center; background: #f2f3f5; border-radius: 6px; cursor: pointer; user-select: none; }
  .record-button-group > div.rec { background: #ffecec; }
  .option-wrap { padding: 8px 14px; border: 1px solid #ddd; border-radius: 6px; width: fit-content; margin: 6px 0; cursor: pointer; }
  .option-wrap.sel { background: #e8f1ff; border-color: #4a90e2; }
  #pc-foot { margin-top: 30px; padding: 12px; border-top: 1px solid #ccc; }
  #pc-foot a { color: #fff; background: #4a90e2; padding: 8px 24px; border-radius: 4px; cursor: pointer; text-decoration: none; }
  .status { margin: 12px 0; padding: 8px; background: #fafafa; border-left: 3px solid #4a90e2; }
  .ok { color: #0a0; } .err { color: #c00; }
</style>
</head>
<body>
<h2>u校园语音题仿真页</h2>
<div class="status" id="st">等待启动…</div>
<div id="q1">
  <p><b>第 1 题（语音）：</b>Read the sentence aloud: Hello world, welcome to unipus.</p>
  <div class="record-button-group" id="rg1">
    <div id="placeholder1">·</div>
    <div id="mic1">🎙 开始录音</div>
  </div>
  <p id="recState1">未录音</p>
</div>
<div id="q2">
  <p><b>第 2 题（判断）：</b>地球是圆的</p>
  <div class="option-wrap" id="optA">A. 对</div>
  <div class="option-wrap" id="optB">B. 错</div>
</div>
<div id="pc-foot"><div><a id="submitBtn">提交</a></div></div>
<script>
(() => {
  // 平台行为仿真：XHR 拉取题目（响应被 MAIN bridge 拦截 → 触发扩展自动答题）
  setTimeout(() => {
  const xhr = new XMLHttpRequest();
  xhr.open('GET', '/course/api/v3/content/quiz?lessonId=voice-e2e');
  xhr.onload = () => { try { window.__quizFetched = JSON.parse(xhr.responseText).code === 0; } catch { window.__quizFetched = false; } };
  xhr.onerror = () => { window.__quizFetched = false; };
  xhr.send();
  }, 2000);

  const st = (msg, cls) => { const el = document.getElementById('st'); el.textContent = msg; el.className = 'status ' + (cls || ''); };
  // ---- React 式录音组件：真实 MediaRecorder + 节点替换（复现停止失效）----
  const rg = document.getElementById('rg1');
  const recState = document.getElementById('recState1');
  let recorder = null, recording = false, micClickCount = 0, stopHandled = 0;
  // deaf 模式开关：?deaf=1 时停止按钮拒绝一切合成点击（isTrusted=false）
  const deaf = new URLSearchParams(location.search).get('deaf') === '1';
  const isSynthetic = (e) => deaf && e.isTrusted === false;

  function renderGroup() {
    // React 重渲染：整组重建（旧节点全部失效——复现实测卡点的根因）
    const replacement = rg.cloneNode(false);
    replacement.innerHTML = '';
    const ph = document.createElement('div');
    ph.id = 'placeholder1'; ph.textContent = '·';
    const btn = document.createElement('div');
    btn.id = recording ? 'stop1' : 'mic1';
    btn.className = recording ? 'rec' : '';
    btn.textContent = recording ? '⏹ 停止' : '🎙 开始录音';
    btn.addEventListener('click', onBtnClick);
    btn.addEventListener('mousedown', onBtnPointer); // 指针监听（覆盖升级点击方式）
    replacement.appendChild(ph);
    replacement.appendChild(btn);
    rg.replaceWith(replacement);
    window.__groupEl = replacement; // 供 CDP 断言
    return replacement;
  }
  function onBtnPointer(e) { /* 只统计，行为在 click */ }
  async function onBtnClick(e) {
    if (isSynthetic(e) && recording) {
      // deaf 模式：录音中拒绝合成点击（复现"录了停不下来"）
      recState.textContent = '录音中…（停止点击被拒 isTrusted=' + e.isTrusted + '，次数 ' + (++stopHandled) + '）';
      recState.className = 'err';
      return;
    }
    if (!recording) {
      micClickCount += 1;
      window.__micClicks = micClickCount;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recorder = new MediaRecorder(stream);
        // onstop 构造时挂（与真实平台一致）：无论停止来源（点击/bridge 强制），
        // onstop 触发即 UI 进入"已录音"状态——这就是平台接受提交的前提。
        recorder.onstop = () => {
          recording = false;
          window.__stoppedAt = Date.now();
          window.__stopOk = true;
          recState.textContent = '已录音 ✓（' + (window.__stopSource || '未知来源') + '，' + Math.round((window.__stoppedAt - window.__recStartAt) / 1000) + 's）';
          recState.className = 'ok';
          renderGroup();
        };
        recorder.start();
        recording = true;
        recState.textContent = '录音中…（MediaRecorder 已启动，' + (deaf ? 'deaf 模式' : '普通模式') + '）';
        recState.className = '';
      } catch (err) {
        recState.textContent = 'getUserMedia/Recorder 失败: ' + err.message;
        recState.className = 'err';
        window.__recordError = String(err && err.message || err);
        return;
      }
    } else {
      // 真实停止：MediaRecorder.stop() → onstop（构造时已挂）→ 前端进入"已录音"
      window.__stopSource = '按钮点击';
      try { recorder.stop(); } catch (err) { /* already stopped */ }
    }
    renderGroup();
  }
  window.__recStartAt = 0;
  window.__stopSource = 'bridge 强制停止';
  const origStart = MediaRecorder.prototype.start;
  MediaRecorder.prototype.start = function () { window.__recStartAt = Date.now(); return origStart.apply(this, arguments); };
  // 初始渲染
  rg.querySelector('#mic1').addEventListener('click', onBtnClick);
  rg.querySelector('#mic1').addEventListener('mousedown', onBtnPointer);
  window.__groupEl = rg;

  // ---- 判断题（选项点击 + DeepSeek mock 校验）----
  let selected = null;
  window.__selectedOption = null;
  for (const id of ['optA', 'optB']) {
    document.getElementById(id).addEventListener('click', function () {
      document.getElementById('optA').classList.remove('sel');
      document.getElementById('optB').classList.remove('sel');
      this.classList.add('sel');
      selected = this.textContent; window.__selectedOption = selected;
    });
  }
  // ---- 提交：语音题必须已录音，否则前端校验拦截（复现平台行为）----
  document.getElementById('submitBtn').addEventListener('click', async () => {
    if (!window.__stopOk) { st('提交被拦截：语音题未完成录音', 'err'); return; }
    const payload = {
      quesDatas: [
        { id: 'q1', answer: JSON.stringify({ value: [''] }) },
      ],
      usedTime: 88,
    };
    try {
      const resp = await fetch('/course/api/v3/newExploration/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const j = await resp.json();
      if (j.code === 0) { st('提交成功 ✓（服务器已记录，usedTime=' + j.usedTimeHint + '）', 'ok'); window.__submitted = true; }
      else st('提交失败: ' + JSON.stringify(j), 'err');
    } catch (err) { st('提交请求失败: ' + err.message, 'err'); }
  });
  st('页面就绪：语音题 1 道 + 判断题 1 道' + (deaf ? '（deaf 模式：停止点击被拒）' : ''));
  window.__ready = true;
})();
</script>
</body>
</html>
